# Netlify deployment configuration
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://vishal-sharma-portfolio.onrender.com"

# Proxy API requests to backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://vishal-sharma-portfolio.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
