<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vishal Sharma - Software Engineer | Full-Stack MERN Portfolio" />
    <title>Vishal Sharma | Software Engineer</title>

    <!-- Preload Display Font -->
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Inline pre-paint script to prevent theme flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
