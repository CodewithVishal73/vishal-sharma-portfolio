<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vishal Sharma — Personal Portfolio</title>
    <meta name="description" content="Personal portfolio of Vishal Sharma, BTech Computer Science undergraduate specializing in backend architecture, API design, and interactive interfaces." />

    <!-- Self-hosted display font preload -->
    <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Inline pre-paint script to prevent theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = saved || pref;
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
