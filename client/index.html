<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1211" />
    <title>Vishal Sharma | Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Vishal Sharma, Software Engineer. Engineering scalable backend systems, robust REST APIs, and modern web applications."
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vishal Sharma | Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Vishal Sharma, Software Engineer. Engineering scalable backend systems, robust REST APIs, and modern web applications."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vishal Sharma | Software Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Vishal Sharma, Software Engineer. Engineering scalable backend systems, robust REST APIs, and modern web applications."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vishal Sharma",
        "jobTitle": "Software Engineer",
        "url": "%VITE_SITE_URL%"
      }
    </script>

    <!-- Preload Display Font -->
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Inline pre-paint script to prevent theme flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
