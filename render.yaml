# Render deployment service configuration
services:
  - type: web
    name: vishal-sharma-portfolio-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
